name: ingest

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
      # Exits non-zero without touching data/latest.json when any source fails or validation rejects the report.
      - run: npm run ingest
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      - name: Commit latest.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || { git commit -m "data: refresh latest.json" && git push; }
