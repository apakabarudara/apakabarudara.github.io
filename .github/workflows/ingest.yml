name: ingest

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # Exits non-zero without touching data/latest.json when any source fails or validation rejects the report.
      # That must not hold back new code: the build below then ships with the previous data/latest.json.
      - id: ingest
        run: npm run ingest
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      - name: Warn that the ingest failed
        if: steps.ingest.outcome == 'failure'
        run: echo "::warning::ingest failed; deployed with the previous data"
      - name: Commit latest.json
        if: steps.ingest.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || { git commit -m "data: refresh latest.json" && git push; }
      # Per-city true-colour photos (web/public/sat, gitignored, regenerated every run). Never blocks the deploy.
      - id: satellite
        run: npm run satellite
        continue-on-error: true
      - name: Warn that the satellite photos failed
        if: steps.satellite.outcome == 'failure'
        run: echo "::warning::satellite photos failed; deployed without fresh photos"
      # Vite bundle + service worker into dist/. A failed build (or failed tests above) stops here, so nothing is deployed.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: ingest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Looks at the live site after the deploy. A failure emails the repo owner, so stale data or a broken deploy is noticed.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: sleep 30
      - run: node scripts/smoke.mjs https://apakabarudara.github.io
