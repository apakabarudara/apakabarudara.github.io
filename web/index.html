<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bisa napas gak?</title>
<meta name="description" content="Cek udara sebelum keluar rumah di musim asap: level hari ini, apa yang perlu dilakukan, dan perkiraan beberapa hari ke depan.">
<meta name="author" content="Khi Hady">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15121A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 64'%3E%3Cg fill='%234B3FB5'%3E%3Cellipse cx='36' cy='42' rx='26' ry='17'/%3E%3Ccircle cx='24' cy='31' r='12'/%3E%3Ccircle cx='38' cy='24' r='14'/%3E%3Ccircle cx='52' cy='31' r='11'/%3E%3C/g%3E%3Cellipse cx='29' cy='40' rx='3' ry='3.6' fill='white'/%3E%3Cellipse cx='43' cy='40' rx='3' ry='3.6' fill='white'/%3E%3C/svg%3E">
<script type="module" src="./app.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="blob" viewBox="0 0 72 64"><ellipse cx="36" cy="42" rx="26" ry="17"/><circle cx="24" cy="31" r="12"/><circle cx="38" cy="24" r="14"/><circle cx="52" cy="31" r="11"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M3 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M15 6a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M15 18a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M8.7 10.7l6.6 -3.4"/><path d="M8.7 13.3l6.6 3.4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"/></symbol>
  <symbol id="i-shirt" viewBox="0 0 24 24"><path d="M8.5 4l-5 2.8 1.9 3.6 2.1-1V20h9V9.4l2.1 1 1.9-3.6-5-2.8c-.6 1.3-2 2.2-3.5 2.2s-2.9-.9-3.5-2.2z"/></symbol>
  <symbol id="i-run" viewBox="0 0 24 24"><path d="M11 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M4 17l5 1l.75 -1.5"/><path d="M15 21v-4l-4 -3l1 -6"/><path d="M7 12v-3l5 -1l3 3l3 1"/></symbol>
  <symbol id="i-window" viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M12 3.5v17M4.5 12h15"/></symbol>
  <symbol id="i-child" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="2.5"/><path d="M12 9v6M8 12.5l4-2 4 2M9 20.5l3-5.5 3 5.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8v8M8 12h8"/></symbol>
</svg>

<ion-app>
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <p class="brand" slot="start">
        <svg class="brand-mark" viewBox="0 0 72 64" aria-hidden="true"><use href="#blob"/><ellipse cx="29" cy="40" rx="3.4" ry="4"/><ellipse cx="43" cy="40" rx="3.4" ry="4"/></svg>
        <span data-copy="brand"></span>
      </p>
      <ion-badge slot="end" class="beta" data-copy="beta"></ion-badge>
    </ion-toolbar>
  </ion-header>

  <ion-content id="content">
    <ion-refresher slot="fixed" id="refresher"><ion-refresher-content></ion-refresher-content></ion-refresher>
    <main class="wrap">
      <div id="previewBanner" class="banner" role="status" hidden></div>
      <div id="banner" class="banner" role="status" hidden></div>

      <!-- Loading, failed first load, expired data: neutral card, no verdict. -->
      <ion-card id="message" class="hero" data-level="0" aria-live="polite" aria-busy="true">
        <span class="mascot" aria-hidden="true"><svg class="mascot-art" viewBox="0 0 72 64"><use class="body" href="#blob"/><ellipse class="shine" cx="31" cy="21" rx="6" ry="3.2" transform="rotate(-18 31 21)"/><ellipse class="eye" cx="29" cy="40" rx="3" ry="3.6"/><ellipse class="eye" cx="43" cy="40" rx="3" ry="3.6"/><ellipse class="cheek" cx="22" cy="46" rx="4" ry="2.4"/><ellipse class="cheek" cx="50" cy="46" rx="4" ry="2.4"/><path class="mouth happy" d="M31 46q5 5 10 0"/></svg></span>
        <h1 id="messageTitle" class="headline"></h1>
        <p id="messageText" class="quip" hidden></p>
        <div id="skeleton" class="skeleton" aria-hidden="true"><span></span><span></span></div>
        <ion-button id="messageOfficial" class="wide" expand="block" fill="outline" target="_blank" rel="noopener" hidden><span data-copy="official"></span><svg class="ic" slot="end" aria-hidden="true"><use href="#i-arrow"/></svg></ion-button>
      </ion-card>

      <div id="overview" class="stack" hidden>
        <ion-card class="hero" data-level="0" aria-labelledby="welcomeTitle">
          <span class="mascot" aria-hidden="true"><svg class="mascot-art" viewBox="0 0 72 64"><use class="body" href="#blob"/><ellipse class="shine" cx="31" cy="21" rx="6" ry="3.2" transform="rotate(-18 31 21)"/><ellipse class="eye" cx="29" cy="40" rx="3" ry="3.6"/><ellipse class="eye" cx="43" cy="40" rx="3" ry="3.6"/><ellipse class="cheek" cx="22" cy="46" rx="4" ry="2.4"/><ellipse class="cheek" cx="50" cy="46" rx="4" ry="2.4"/><path class="mouth happy" d="M31 46q5 5 10 0"/></svg></span>
          <h2 id="welcomeTitle" class="headline"></h2>
          <ion-button id="locateOverview" class="wide" expand="block"><svg class="ic" slot="start" aria-hidden="true"><use href="#i-pin"/></svg><span data-copy="useLocation"></span></ion-button>
          <p id="overviewHint" class="note" aria-live="polite"></p>
        </ion-card>
        <ion-card class="panel" aria-labelledby="overviewTitle">
          <h2 id="overviewTitle" data-copy="overviewTitle"></h2>
          <p id="overviewSub" class="sub"></p>
          <ion-list id="cityList" lines="inset"></ion-list>
        </ion-card>
      </div>

      <div id="city" class="stack" hidden>
        <div class="city-bar">
          <ion-item class="picker" lines="none">
            <ion-select id="select" interface="action-sheet" aria-label="Pilih kota"></ion-select>
          </ion-item>
          <ion-button id="locate" class="locate"><svg class="ic" slot="start" aria-hidden="true"><use href="#i-pin"/></svg><span class="label" data-copy="nearestButton"></span></ion-button>
        </div>
        <p id="cityHint" class="note" aria-live="polite"></p>

        <ion-card id="answer" class="hero" data-level="0" aria-live="polite">
          <span class="mascot" aria-hidden="true"><svg class="mascot-art" viewBox="0 0 72 64"><use class="body" href="#blob"/><ellipse class="shine" cx="31" cy="21" rx="6" ry="3.2" transform="rotate(-18 31 21)"/><path class="brow" d="M24 35l6-2.5M48 35l-6-2.5"/><ellipse class="eye" cx="29" cy="40" rx="3" ry="3.6"/><ellipse class="eye" cx="43" cy="40" rx="3" ry="3.6"/><ellipse class="cheek" cx="22" cy="46" rx="4" ry="2.4"/><ellipse class="cheek" cx="50" cy="46" rx="4" ry="2.4"/><path class="mouth happy" d="M31 46q5 5 10 0"/><path class="mouth flat" d="M32 47.5h8"/><path class="mouth sad" d="M31 49q5-5 10 0"/><g class="mask"><path class="strap" d="M25 46l-11-4M47 46l11-4"/><rect x="25" y="43" width="22" height="12" rx="5"/><path class="pleat" d="M29 47.5h14M29 51h14"/></g></svg></span>
          <p id="levelLabel" class="lvl"></p>
          <h2 id="headline" class="headline"></h2>
          <p id="quip" class="quip"></p>
          <ul id="actions" class="actions"></ul>
          <div id="symptoms" class="symptoms"><p data-copy="symptomsMild"></p><p data-copy="symptomsEmergency"></p></div>
          <div class="btns">
            <ion-button id="shareGood" class="lv-btn"><svg class="ic" slot="start" aria-hidden="true"><use href="#i-sun"/></svg><span data-copy="goodNews"></span></ion-button>
            <ion-button id="health" class="lv-btn" target="_blank" rel="noopener"><svg class="ic" slot="start" aria-hidden="true"><use href="#i-plus"/></svg><span data-copy="healthButton"></span></ion-button>
            <ion-button id="call" class="lv-ghost" fill="outline" href="tel:119"><svg class="ic" slot="start" aria-hidden="true"><use href="#i-phone"/></svg>119</ion-button>
          </div>
          <div class="foot">
            <span id="stamp"></span>
            <ion-button id="aboutBtn" class="about" fill="clear"><span class="q" slot="start" aria-hidden="true">?</span><span data-copy="explainTitle"></span></ion-button>
          </div>
        </ion-card>

        <ion-card id="today" class="panel" aria-labelledby="todayTitle">
          <h2 id="todayTitle" data-copy="todayTitle"></h2>
          <ul id="activities" class="activities"></ul>
          <p id="best" class="best"></p>
          <div id="strip" class="strip" role="img"></div>
          <div id="ticks" class="ticks" aria-hidden="true"></div>
          <p id="stripLegend" class="legend" data-copy="stripLegend"></p>
        </ion-card>

        <ion-card id="outlook" class="panel" aria-labelledby="outlookTitle">
          <h2 id="outlookTitle" data-copy="outlookTitle"></h2>
          <p class="sub" data-copy="outlookSub"></p>
          <div id="days" class="days" role="group" aria-labelledby="outlookTitle"></div>
          <p id="dayDetail" class="day-detail" aria-live="polite"></p>
        </ion-card>

        <ion-card class="fold">
          <ion-accordion-group>
            <ion-accordion value="reasons">
              <ion-item slot="header" lines="none"><ion-label><h2 data-copy="reasonsTitle"></h2></ion-label></ion-item>
              <div slot="content" class="fold-body">
                <dl class="rows">
                  <div class="row"><dt id="hotLabel"></dt><dd id="hot"></dd></div>
                  <div class="row"><dt data-copy="wind"></dt><dd id="wind"></dd></div>
                  <div class="row"><dt id="rainLabel"></dt><dd id="rain"></dd></div>
                </dl>
                <p id="source" class="small"></p>
              </div>
            </ion-accordion>
          </ion-accordion-group>
        </ion-card>
      </div>

      <div id="shareBlock" hidden>
        <ion-button id="share" class="wide soft" expand="block"><svg class="ic" slot="start" aria-hidden="true"><use href="#i-share"/></svg><span data-copy="share"></span></ion-button>
        <p id="shareNote" class="note" aria-live="polite"></p>
      </div>

      <ion-card id="more" class="fold">
        <ion-accordion-group>
          <ion-accordion value="more">
            <ion-item slot="header" lines="none"><ion-label><h2 data-copy="moreTitle"></h2></ion-label></ion-item>
            <div slot="content" class="fold-body more-body">
              <div id="factsBlock">
                <div class="facts-head"><h3 data-copy="factsTitle"></h3><ion-button id="factsNext" fill="clear" class="small-btn"><span data-copy="factsNext"></span></ion-button></div>
                <p id="fact"></p>
              </div>
              <div>
                <h3 data-copy="pollTitle"></h3>
                <div id="poll" class="choices"></div>
                <p id="pollNote" class="note" aria-live="polite"></p>
              </div>
              <div>
                <h3><label for="feedback" data-copy="feedbackTitle"></label></h3>
                <p class="note" data-copy="feedbackNote"></p>
                <textarea id="feedback" class="textarea"></textarea>
                <div class="end"><ion-button id="sendFb" fill="solid" class="soft"><span data-copy="feedbackSend"></span></ion-button></div>
                <p id="fbNote" class="note" aria-live="polite"></p>
              </div>
            </div>
          </ion-accordion>
        </ion-accordion-group>
      </ion-card>

      <footer class="footer">
        <p data-copy="footerDisclaimer"></p>
        <p><span data-copy="creditsIntro"></span> <a href="https://open-meteo.com/" target="_blank" rel="noopener" data-copy="creditOpenMeteo"></a> <span data-copy="creditOpenMeteoLicence"></span> · <span id="camsCredit"></span> · <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" rel="noopener" data-copy="creditFirms"></a> · <span data-copy="creditIspu"></span></p>
        <details class="fine">
          <summary data-copy="privacyTitle"></summary>
          <p data-copy="privacy"></p>
        </details>
        <p class="credit"><span data-copy-credit="0"></span><a href="https://github.com/khihadysucahyo" target="_blank" rel="noopener" data-copy-credit="1"></a><span data-copy-credit="2"></span><a href="https://github.com/bisanapasgak/bisanapasgak.github.io" target="_blank" rel="noopener" data-copy-credit="3"></a></p>
      </footer>
    </main>
  </ion-content>

  <ion-modal id="about" class="sheet" aria-labelledby="aboutTitle">
    <div class="sheet-body">
      <div class="sheet-head">
        <h2 id="aboutTitle" data-copy="explainTitle"></h2>
        <ion-button id="aboutClose" fill="clear"><span data-copy="close"></span></ion-button>
      </div>
      <div id="explain" class="explain"></div>
      <p class="small" data-copy="medicalNote"></p>
      <p class="who"><span data-copy="sensitiveIntro"></span><strong id="sensitive"></strong></p>
      <ion-button id="official" class="wide" expand="block" fill="outline" target="_blank" rel="noopener"><span data-copy="official"></span><svg class="ic" slot="end" aria-hidden="true"><use href="#i-arrow"/></svg></ion-button>
    </div>
  </ion-modal>
</ion-app>
</body>
</html>
