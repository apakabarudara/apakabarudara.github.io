<script>
// A deploy can delete the hashed files a stale page still wants: if the app script fails to load, reload once. app.js clears the flag when it boots.
// Which skeleton to paint before the app script runs: a link or a saved city means a city view is coming, otherwise the overview.
try {
  const coming = decodeURIComponent(location.hash.slice(1)) || localStorage.getItem('bisanapasgak.city') || /[?&]city=/.test(location.search);
  if (!coming) document.documentElement.dataset.boot = 'overview';
} catch (_) { /* default: the city skeleton */ }
addEventListener('error', e => {
  if (e.target.tagName !== 'SCRIPT') return;
  try { if (sessionStorage.getItem('bng-reloaded')) return; sessionStorage.setItem('bng-reloaded', '1'); } catch (_) { return; }
  location.reload();
}, true);
</script>

  <main style="max-width:36rem;margin:0 auto;padding:1rem;font-family:system-ui,sans-serif;line-height:1.5">
    <h1>Apa Kabar Udara</h1>
    <p>Perkiraan asap dan kualitas udara hari ini untuk 13 kota di Sumatera dan Kalimantan: Balikpapan, Banjarbaru, Banjarmasin, Dumai, Jambi, Ketapang, Palangkaraya, Palembang, Pekanbaru, Pontianak, Samarinda, Sampit, dan Tarakan.</p>
    <p>Angkanya perkiraan model (CAMS Copernicus lewat Open-Meteo) yang diperbarui tiap jam, bukan hasil alat ukur, jadi bisa meleset. Untuk angka resmi, lihat ISPU dari Kementerian Lingkungan Hidup. Ada juga foto satelit NASA dan peta titik panas.</p>
    <p>Halaman ini butuh JavaScript untuk menampilkan perkiraan kotamu.</p>
  </main>
</noscript>
